server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 10m;   # evidence photos (API caps each file at TECHSO_MAX_UPLOAD_MB)

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  # Terminate TLS in front of this container (GPS and the service worker require https outside localhost).

  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; }
  location /ws {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; }
}
